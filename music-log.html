<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chae's Music Log</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px 32px 80px;
        background: #fff;
        color: #000;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      /* top bar */
      .topbar {
        display: flex;
        align-items: baseline;
        gap: 40px;
        margin-bottom: 28px;
      }

      .sitename {
        white-space: nowrap;
      }

      .searchwrap {
        flex: 1;
        display: flex;
        justify-content: flex-start;
      }

      #search {
        width: 340px;
        max-width: 100%;
        border: none;
        background: #efefef;
        font-family: inherit;
        font-size: 13px;
        padding: 3px 6px;
        outline: none;
        color: #000;
      }

      #search::placeholder {
        color: #888;
      }

      .info {
        font-weight: bold;
        white-space: nowrap;
        margin-left: auto;
      }

      /* table */
      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        vertical-align: top;
        padding: 4px 16px 4px 0;
        border-bottom: 1px solid #d3d3d3;
        font-weight: normal;
      }

      thead th {
        border-bottom: 1px solid #d3d3d3
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
      }

      thead th:hover {
        color: #666;
      }

      .col-r {
        width: 48px;
      }
      .col-album {
        font-weight: bold;
      }
      .col-year,
      .col-date {
        width: 5rem;
        white-space: nowrap;
      }

      td.col-album a {
        color: inherit;
        text-decoration: none;
      }
      td.col-album a:hover {
        text-decoration: underline;
      }

      .sortmark {
        font-size: 10px;
      }

      #status {
        padding: 8px 0;
        color: #888;
      }

      tr.hidden {
        display: none;
      }

      @media (max-width: 900px) {
        .col-date,
        .col-label,
        .col-year {
          display: none;
        }
      }

      @media (max-width: 700px) {
        body {
          padding: 16px;
          font-size: 12px;
        }
        .topbar {
          flex-wrap: wrap;
          gap: 12px;
        }
        #search {
          width: 100%;
        }
        .info {
          margin-left: 0;
        }
        th,
        td {
          padding-right: 8px;
        }
        .col-r,
        .col-genre {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="sitename">A record of what Chae listens to while building a website...</div>
      <div class="searchwrap">
        <input id="search" type="text" placeholder="search" autocomplete="off" />
      </div>
    </div>

    <div id="status">loading…</div>

    <table id="table" hidden>
      <thead>
        <tr>
          <th class="col-r" data-i="-1"><span class="sortmark">▲</span></th>
          <th class="col-album" data-i="0">ALBUM</th>
          <th class="col-artist" data-i="1">ARTIST</th>
          <th class="col-genre" data-i="5">GENRE</th>
          <th class="col-label" data-i="6">LABEL</th>
          <th class="col-year" data-i="2">YEAR</th>
          <th class="col-date" data-i="3">DATE</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <script>
      const API =
        "https://script.google.com/macros/s/AKfycbyX7yfu-mJOKVgNSa8gHiqXsj2-y0T3lzzjNtzchecBJR2HtQm2XnZ9_n3u3NRBqDukdQ/exec";

      let entries = [];
      let sortCol = -1;
      let sortAsc = true;

      function yearOf(v) {
        const s = String(v || "");
        const m = s.match(/\d{4}/);
        return m ? m[0] : "";
      }

      function dateOf(v) {
        const s = String(v || "").trim();

        let m = s.match(/^(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\./);
        if (m) {
          const [, y, mo, d] = m;
          return `${d.padStart(2, "0")}-${mo.padStart(2, "0")}-${y}`;
        }

        const datePart = s.split(/[ T]/)[0].replace(/\.$/, "");
        m = datePart.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        return m ? `${m[3]}-${m[2]}-${m[1]}` : datePart;
      }

      function labelOf(v) {
        const s = String(v || "");
        return s.replace(/^\s*[℗©]\s*\d{4}\s*/, "").trim();
      }

      function render() {
        const tbody = document.getElementById("tbody");
        tbody.innerHTML = "";

        entries.forEach((row, idx) => {
          const [album, artist, year, listened, link, genre, label] = row;

          const tr = document.createElement("tr");
          tr.dataset.search = [album, artist, genre, label, yearOf(year)].join(" ").toLowerCase();

          const cells = [
            { cls: "col-r", text: row._n },
            { cls: "col-album", text: album, href: link },
            { cls: "col-artist", text: artist },
            { cls: "col-genre", text: genre },
            { cls: "col-label", text: labelOf(label) },
            { cls: "col-year", text: yearOf(year) },
            { cls: "col-date", text: dateOf(listened) },
          ];

          cells.forEach((c) => {
            const td = document.createElement("td");
            td.className = c.cls;
            if (c.href) {
              const a = document.createElement("a");
              a.href = c.href;
              a.target = "_blank";
              a.rel = "noopener";
              a.textContent = c.text || "";
              td.appendChild(a);
            } else {
              td.textContent = c.text || "";
            }
            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        });

        filter();
      }

      function filter() {
        const q = document.getElementById("search").value.trim().toLowerCase();
        document.querySelectorAll("#tbody tr").forEach((tr) => {
          tr.classList.toggle("hidden", q !== "" && !tr.dataset.search.includes(q));
        });
      }

      function sortBy(i) {
        if (sortCol === i) {
          sortAsc = !sortAsc;
        } else {
          sortCol = i;
          sortAsc = true;
        }

        entries.sort((a, b) => {
          let va, vb;
          if (i === -1) {
            va = a._n;
            vb = b._n;
          } else if (i === 2) {
            va = yearOf(a[2]);
            vb = yearOf(b[2]);
          } else {
            va = String(a[i] || "").toLowerCase();
            vb = String(b[i] || "").toLowerCase();
          }
          if (va < vb) return sortAsc ? -1 : 1;
          if (va > vb) return sortAsc ? 1 : -1;
          return 0;
        });

        document.querySelectorAll("thead th").forEach((th) => {
          const mark = th.querySelector(".sortmark");
          if (mark) mark.remove();
          if (Number(th.dataset.i) === i) {
            const s = document.createElement("span");
            s.className = "sortmark";
            s.textContent = sortAsc ? " ▲" : " ▼";
            th.appendChild(s);
          }
        });

        render();
      }

      async function load() {
        const status = document.getElementById("status");
        try {
          const res = await fetch(API);
          const rows = await res.json();
          const body = rows.slice(1).filter((r) => r[0]);

          entries = body.map((r, i) => {
            r._n = i + 1;
            return r;
          });

          if (entries.length === 0) {
            status.textContent = "no entries yet";
            return;
          }

          status.hidden = true;
          document.getElementById("table").hidden = false;
          render();
        } catch (err) {
          status.textContent = "failed to load — " + err.message;
        }
      }

      document.getElementById("search").addEventListener("input", filter);
      document.querySelectorAll("thead th").forEach((th) => {
        th.addEventListener("click", () => sortBy(Number(th.dataset.i)));
      });

      load();
    </script>
  </body>
</html>
